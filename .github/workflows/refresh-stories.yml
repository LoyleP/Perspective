# Hourly news refresh. Vercel's Hobby plan only allows a daily cron, so GitHub Actions calls the
# same endpoint every hour (scheduled workflows only run from the default branch).
# Needs the repository secret CRON_SECRET (same value as on Vercel).
name: Refresh stories

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Call refresh-stories
        run: |
          curl --fail --silent --show-error --max-time 320 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://api-chi-henna-92.vercel.app/api/refresh-stories
